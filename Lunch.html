<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たき火炉端 雨やどり | ランチアンケート</title>
<style>
:root { --sun: #ff9a3c; --clay: #d9531e; --wood: #3a2415; --ink: #2a1a10; --cream: #fff8ef; --paper: #fffaf3; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Zen Kaku Gothic New', sans-serif; background: var(--cream); color: var(--ink); display: flex; justify-content: center; min-height: 100vh; }
.app { width: 100%; max-width: 430px; background: var(--paper); min-height: 100vh; display: flex; flex-direction: column; }
.header { background: var(--wood); color: #fff; padding: 20px; text-align: center; }
.header small { color: var(--sun); font-size: 0.75rem; display: block; margin-bottom: 4px; }
.header h1 { font-size: 1.3rem; margin-bottom: 6px; }
.header p { font-size: 0.8rem; color: #ccc; }
.content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
.question-title { font-size: 1.05rem; font-weight: bold; margin: 20px 0 15px; }
.emoji-group { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 30px; }
.emoji-btn { flex: 1; background: #fff; border: 2px solid #ddd; border-radius: 12px; padding: 12px 0; font-size: 1.8rem; text-align: center; cursor: pointer; transition: all 0.2s; }
.emoji-btn.selected { border-color: var(--clay); background: #ffe8df; transform: scale(1.05); }
.next-btn { background: #dcd6cd; color: #fff; border: none; padding: 18px; border-radius: 50px; font-size: 1rem; font-weight: bold; width: 100%; margin-top: auto; cursor: not-allowed; transition: background 0.2s; }
.next-btn.active { background: var(--clay); cursor: pointer; box-shadow: 0 4px 12px rgba(217,83,30,0.3); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <small>たき火炉端 / 千歳</small>
    <h1>雨やどり ランチアンケート</h1>
    <p>3分ほどで終わります。今日のランチはいかがでしたか？</p>
  </div>
  <div class="content">
    <div class="question-title">Q1. 総合的な満足度を教えてください</div>
    
    <div class="emoji-group">
      <div class="emoji-btn" onclick="selectEmoji(this, 1)">😒</div>
      <div class="emoji-btn" onclick="selectEmoji(this, 2)">🙁</div>
      <div class="emoji-btn" onclick="selectEmoji(this, 3)">😐</div>
      <div class="emoji-btn" onclick="selectEmoji(this, 4)">🙂</div>
      <div class="emoji-btn" onclick="selectEmoji(this, 5)">😁</div>
    </div>

    <button id="nextBtn" class="next-btn" onclick="goNext()" disabled>次へ</button>
  </div>
</div>

<script>
  let selectedScore = 0;

  function selectEmoji(element, score) {
    // 既存の選択を解除
    document.querySelectorAll('.emoji-btn').forEach(btn => btn.classList.remove('selected'));
    // クリックされたものに選択状態を付与
    element.classList.add('selected');
    selectedScore = score;
    
    // 次へボタンを有効化
    const nextBtn = document.getElementById('nextBtn');
    nextBtn.classList.add('active');
    nextBtn.removeAttribute('disabled');
  }

  function goNext() {
    if (selectedScore > 0) {
      alert('ご回答ありがとうございます！次のステップへ進みます。');
      // ここに次の画面への遷移処理などを追加できます
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たき火炉端 雨やどり</title>
<style>
:root { --fire: #cc3300; --amber: #ffaa00; --wood: #2a1100; --smoke: #1a0a00; --white: #2a1a10; --google-blue: #4285F4; }
body { font-family: sans-serif; background: #000; color: #fff; margin: 0; display: flex; justify-content: center; }
.app { width: 100%; max-width: 430px; min-height: 100vh; background: var(--white); display: flex; flex-direction: column; }
.screen { display: none; flex-direction: column; flex: 1; padding: 20px; }
.screen.active { display: flex; }
.ex-btn { background: #333; border: 1px solid #555; color: #fff; padding: 15px; margin-bottom: 10px; width: 100%; border-radius: 8px; text-align: left; }
textarea { width: 100%; height: 100px; border-radius: 8px; padding: 10px; margin-bottom: 20px; }
.submit-btn, .google-btn { background: var(--amber); color: #000; padding: 20px; border-radius: 50px; font-weight: bold; width: 100%; border: none; }
.google-btn { background: var(--google-blue); color: #fff; margin-top: 20px; }
</style>
</head>
<body>
<div class="app">
  <div class="screen active" id="screen1">
    <h2>たき火炉端 雨やどり</h2>
    <p>感想を書いてガチャ無料！</p>
    <div id="examples"></div>
    <textarea id="feedback" placeholder="ご感想を入力"></textarea>
    <button class="submit-btn" onclick="next()">ガチャ券をもらう</button>
  </div>
  <div class="screen" id="screen2">
    <h2>🎰 ガチャ無料券</h2>
    <p>スタッフにお見せください</p>
    <button class="google-btn" onclick="window.location.href='https://search.google.com/local/writereview?placeid=ChIJeXMJxU8hdV8R5H1WEAt2Myc'">Googleで応援して完了</button>
  </div>
</div>
<script>
  const texts = ["料理もお酒も最高でした！", "雰囲気が良くて癒やされました", "また絶対に来ます！"];
  const cont = document.getElementById('examples');
  texts.forEach(t => {
    const b = document.createElement('button');
    b.className = 'ex-btn'; b.textContent = t;
    b.onclick = () => document.getElementById('feedback').value = t;
    cont.appendChild(b);
  });
  function next() { document.getElementById('screen1').classList.remove('active'); document.getElementById('screen2').classList.add('active'); }
</script>
</body>
</html>
